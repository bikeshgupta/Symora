<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Symora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme resolution must run before first paint, blocking, or dark-mode users see a
      white flash. See .claude/rules/design-system.md § Theme switching.
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('symora-theme');
          var dark =
            s === 'dark' ||
            (s !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
